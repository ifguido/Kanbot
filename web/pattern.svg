<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" preserveAspectRatio="none">
  <!--
    Patrón de fondo de guidofaranna.com.
    Tile de 1200×800 que se repite hacia abajo y se estira al ancho de la pantalla
    (preserveAspectRatio="none": las barras mantienen su alto, cambia su largo).
    x=0 arranca en el borde izquierdo; x=1200 termina en el borde derecho.
    La opacidad la pone el CSS (variable pattern-opacity); acá va al 100 %.
  -->
  <g fill="#0a0a0a" stroke="#0a0a0a" stroke-linecap="square">
    <!-- desde la izquierda -->
    <rect x="0" y="60" width="380" height="12"/>
    <rect x="0" y="200" width="520" height="6"/>
    <rect x="0" y="320" width="90" height="14"/>
    <rect x="0" y="470" width="640" height="6"/>
    <rect x="0" y="530" width="300" height="10"/>
    <rect x="0" y="680" width="140" height="16"/>
    <rect x="0" y="770" width="460" height="6"/>
    <!-- dobles desde la izquierda -->
    <rect x="0" y="250" width="220" height="8"/>
    <rect x="0" y="266" width="220" height="8"/>
    <!-- desde la derecha -->
    <rect x="1100" y="100" width="100" height="6"/>
    <rect x="760" y="140" width="440" height="8"/>
    <rect x="680" y="330" width="520" height="6"/>
    <rect x="1040" y="380" width="160" height="14"/>
    <rect x="760" y="640" width="440" height="6"/>
    <rect x="560" y="740" width="640" height="10"/>
    <!-- dobles desde la derecha -->
    <rect x="980" y="420" width="220" height="6"/>
    <rect x="980" y="434" width="220" height="6"/>
    <rect x="880" y="580" width="320" height="6"/>
    <rect x="880" y="596" width="320" height="6"/>
    <!-- diagonales -->
    <line x1="300" y1="560" x2="620" y2="240" stroke-width="12"/>
    <line x1="860" y1="60" x2="1000" y2="200" stroke-width="8"/>
    <line x1="120" y1="760" x2="260" y2="620" stroke-width="8"/>
    <line x1="1000" y1="520" x2="1160" y2="360" stroke-width="10"/>
  </g>
</svg>
