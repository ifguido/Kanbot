<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Kanbot</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="/style.css" />
    <!-- Bloqueante a propósito: decide el idioma antes del primer paint. -->
    <script src="/i18n.js"></script>
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main id="login" hidden>
      <form id="login-form" class="login-card">
        <h1>📋 Kanbot</h1>
        <p data-i18n-html="board.loginText">
          Escribí <code>@web</code> en el chat de WhatsApp para recibir el link, o pegá la clave acá.
        </p>
        <input
          id="login-key"
          placeholder="Clave"
          data-i18n-placeholder="board.key"
          autocomplete="off"
          spellcheck="false"
          required
        />
        <button type="submit" data-i18n="board.enter">Entrar</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </main>

    <div id="board" hidden>
      <header class="topbar">
        <h1 id="board-name">Tickets</h1>
        <div class="actions">
          <select class="lang-select" data-lang-select aria-label="Idioma" data-i18n-aria-label="lang.label">
            <option value="es">ES</option>
            <option value="en">EN</option>
            <option value="de">DE</option>
            <option value="it">IT</option>
            <option value="sw">SW</option>
          </select>
          <button
            id="refresh"
            class="ghost"
            type="button"
            title="Actualizar"
            aria-label="Actualizar"
            data-i18n-title="board.refresh"
            data-i18n-aria-label="board.refresh"
          >
            ↻
          </button>
          <button id="logout" class="ghost" type="button" data-i18n="board.logout">Salir</button>
        </div>
      </header>

      <main class="columns">
        <section class="column" data-status="todo">
          <h2><span data-i18n="status.todo">Por hacer</span> <span class="count"></span></h2>
          <form class="add-form">
            <input
              name="title"
              placeholder="+ Agregar ticket"
              data-i18n-placeholder="board.add"
              autocomplete="off"
              maxlength="500"
            />
          </form>
          <div class="cards"></div>
        </section>
        <section class="column" data-status="doing">
          <h2><span data-i18n="status.doing">Haciendo</span> <span class="count"></span></h2>
          <div class="cards"></div>
        </section>
        <section class="column" data-status="done">
          <h2><span data-i18n="status.done">Hecho</span> <span class="count"></span></h2>
          <div class="cards"></div>
        </section>
      </main>
    </div>

    <dialog id="editor">
      <form id="editor-form">
        <div class="editor-head">
          <span id="editor-number" class="num"></span>
          <select id="editor-status" aria-label="Estado" data-i18n-aria-label="board.statusLabel">
            <option value="todo" data-i18n="status.todo">Por hacer</option>
            <option value="doing" data-i18n="status.doing">Haciendo</option>
            <option value="done" data-i18n="status.done">Hecho</option>
          </select>
        </div>
        <label>
          <span data-i18n="board.title">Título</span>
          <input id="editor-title" required maxlength="500" />
        </label>
        <label>
          <span data-i18n="board.description">Descripción</span>
          <textarea
            id="editor-description"
            rows="8"
            maxlength="10000"
            placeholder="Detalles, links, pasos…"
            data-i18n-placeholder="board.descPlaceholder"
          ></textarea>
        </label>
        <p id="editor-meta" class="meta"></p>
        <div class="editor-actions">
          <button id="editor-delete" class="danger" type="button" data-i18n="board.delete">Borrar</button>
          <span class="spacer"></span>
          <button id="editor-cancel" class="ghost" type="button" data-i18n="board.cancel">Cancelar</button>
          <button type="submit" data-i18n="board.save">Guardar</button>
        </div>
      </form>
    </dialog>

    <div id="toast" role="status" hidden></div>
  </body>
</html>
