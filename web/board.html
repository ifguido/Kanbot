<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Kanbot</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main id="login" hidden>
      <form id="login-form" class="login-card">
        <h1>📋 Kanbot</h1>
        <p>Escribí <code>@web</code> en el chat de WhatsApp para recibir el link, o pegá la clave acá.</p>
        <input id="login-key" placeholder="Clave" autocomplete="off" spellcheck="false" required />
        <button type="submit">Entrar</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </main>

    <div id="board" hidden>
      <header class="topbar">
        <h1 id="board-name">Tickets</h1>
        <div class="actions">
          <button id="refresh" class="ghost" type="button" title="Actualizar" aria-label="Actualizar">↻</button>
          <button id="logout" class="ghost" type="button">Salir</button>
        </div>
      </header>

      <main class="columns">
        <section class="column" data-status="todo">
          <h2>Por hacer <span class="count"></span></h2>
          <form class="add-form">
            <input name="title" placeholder="+ Agregar ticket" autocomplete="off" maxlength="500" />
          </form>
          <div class="cards"></div>
        </section>
        <section class="column" data-status="doing">
          <h2>Haciendo <span class="count"></span></h2>
          <div class="cards"></div>
        </section>
        <section class="column" data-status="done">
          <h2>Hecho <span class="count"></span></h2>
          <div class="cards"></div>
        </section>
      </main>
    </div>

    <dialog id="editor">
      <form id="editor-form">
        <div class="editor-head">
          <span id="editor-number" class="num"></span>
          <select id="editor-status" aria-label="Estado">
            <option value="todo">Por hacer</option>
            <option value="doing">Haciendo</option>
            <option value="done">Hecho</option>
          </select>
        </div>
        <label>
          Título
          <input id="editor-title" required maxlength="500" />
        </label>
        <label>
          Descripción
          <textarea id="editor-description" rows="8" maxlength="10000" placeholder="Detalles, links, pasos…"></textarea>
        </label>
        <p id="editor-meta" class="meta"></p>
        <div class="editor-actions">
          <button id="editor-delete" class="danger" type="button">Borrar</button>
          <span class="spacer"></span>
          <button id="editor-cancel" class="ghost" type="button">Cancelar</button>
          <button type="submit">Guardar</button>
        </div>
      </form>
    </dialog>

    <div id="toast" role="status" hidden></div>
  </body>
</html>
